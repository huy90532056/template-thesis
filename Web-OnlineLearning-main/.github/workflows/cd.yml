name: "Build and deploy to server"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 1. Checkout source code
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------
      # 2. Login Docker Hub
      # -----------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -----------------------------
      # 3. Build + Push Multi-platform Image (NextJS correct)
      # -----------------------------
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fe-web-online-learning:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/fe-web-online-learning:cache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/fe-web-online-learning:cache,mode=max

      # -----------------------------
      # 4. SSH Deploy to Server
      # -----------------------------
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            echo "📁 Moving to project directory..."
            cd ~/Web-Online-Learning || { echo "❌ Directory not found"; exit 1; }

            echo "📥 Pulling latest image..."
            docker compose -f docker-compose.yml pull frontend

            echo "🔄 Redeploying frontend service..."
            docker compose -f docker-compose.yml up -d --pull always --force-recreate

            echo "⏳ Waiting for service to restart..."
            sleep 20

            echo "📊 Service status:"
            docker compose -f docker-compose.yml ps

            echo "📜 Last 50 logs:"
            docker compose logs --tail=50 frontend

            echo "🧹 Cleaning unused resources..."
            docker system prune -af --volumes

            echo "✅ Deployment completed successfully!"
